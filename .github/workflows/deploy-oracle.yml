name: Deploy to Oracle

on:
  push:
    branches: [main]

concurrency:
  group: oracle-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script_stop: true
          command_timeout: 20m
          script: |
            set -euo pipefail
            if [ ! -d "$HOME/exam-prep/.git" ]; then
              git clone https://github.com/Yash-suthar/exam-prep.git "$HOME/exam-prep"
            fi
            cd "$HOME/exam-prep"
            git fetch origin
            git checkout main
            git pull --ff-only origin main
            test -f .env
            docker compose up -d --build app db
