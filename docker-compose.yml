services:
  db:
    image: postgres:16-alpine
    container_name: meritpath-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: meritpath
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: exam_prep
    volumes:
      - meritpath-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meritpath -d exam_prep"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    container_name: meritpath-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://meritpath:${POSTGRES_PASSWORD}@db:5432/exam_prep
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    volumes:
      - meritpath-uploads:/app/uploads
    expose:
      - "3000"

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: meritpath-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://app:3000
    depends_on:
      - app

volumes:
  meritpath-pg:
  meritpath-uploads:
